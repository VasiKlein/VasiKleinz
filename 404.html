<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b10">
  <title>404 — Temporarily Unavailable</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --text: #f5f5f7;
      --muted: rgba(245, 245, 247, .68);
      --glass: rgba(255, 255, 255, .10);
      --border: rgba(255, 255, 255, .18);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(91, 119, 255, .28), transparent 34%),
        radial-gradient(circle at 80% 75%, rgba(184, 86, 255, .24), transparent 36%),
        linear-gradient(135deg, #07070b, #11111a 55%, #09090d);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .45;
      pointer-events: none;
      animation: float 10s ease-in-out infinite alternate;
    }

    body::before {
      background: #4169ff;
      top: -180px;
      left: -140px;
    }

    body::after {
      background: #a23cff;
      right: -150px;
      bottom: -190px;
      animation-delay: -4s;
    }

    .glass {
      position: relative;
      width: min(680px, calc(100% - 36px));
      padding: 58px 42px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 32px;
      background: var(--glass);
      backdrop-filter: blur(28px) saturate(150%);
      -webkit-backdrop-filter: blur(28px) saturate(150%);
      box-shadow:
        0 30px 80px rgba(0, 0, 0, .42),
        inset 0 1px 0 rgba(255, 255, 255, .12);
      animation: appear .8s ease-out both;
    }

    .glass::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(
        120deg,
        rgba(255,255,255,.10),
        transparent 35%,
        transparent 65%,
        rgba(255,255,255,.04)
      );
      pointer-events: none;
    }

    .code {
      position: relative;
      margin: 0 0 10px;
      font-size: clamp(76px, 16vw, 132px);
      line-height: .9;
      font-weight: 800;
      letter-spacing: -0.075em;
      background: linear-gradient(180deg, #fff, rgba(255,255,255,.48));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 10px 40px rgba(255,255,255,.08);
    }

    h1 {
      position: relative;
      margin: 22px 0 12px;
      font-size: clamp(25px, 5vw, 38px);
      line-height: 1.1;
      letter-spacing: -.035em;
      font-weight: 700;
    }

    p {
      position: relative;
      max-width: 510px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.65;
    }

    .status {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 30px;
      padding: 10px 15px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      color: rgba(255,255,255,.78);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .02em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffd60a;
      box-shadow: 0 0 14px rgba(255,214,10,.7);
      animation: pulse 1.8s infinite;
    }

    .footer {
      position: fixed;
      bottom: 22px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,.32);
      font-size: 12px;
      letter-spacing: .03em;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(18px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes float {
      from { transform: translate3d(0, 0, 0) scale(1); }
      to { transform: translate3d(35px, 25px, 0) scale(1.08); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.8); }
    }

    @media (max-width: 520px) {
      .glass {
        padding: 45px 25px;
        border-radius: 26px;
      }

      p { font-size: 15px; }
      .footer { bottom: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="glass" role="main">
    <div class="code">404</div>

    <h1>Site Temporarily Unavailable</h1>

    <p>
      The website is currently being redesigned.
      A new experience is being created right now.
      Please check back in a few hours.
    </p>

    <div class="status">
      <span class="dot"></span>
      New design in progress
    </div>
  </main>

  <div class="footer">Thank you for your patience.</div>
</body>
</html>
